<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频转 MP3</title>
<style>
  :root {
    --bg: #f4f4f0;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8a84;
    --accent: #4a7c59;
    --accent-soft: #e8f0ea;
    --line: #e3e3dd;
    --danger: #b0524e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 460px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .drop {
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 42px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop .icon { font-size: 34px; margin-bottom: 10px; }
  .drop .hint { font-size: 15px; margin-bottom: 4px; }
  .drop .tip { font-size: 12px; color: var(--muted); }
  input[type=file] { display: none; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin-top: 14px; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .url-row { display: flex; gap: 8px; margin-top: 12px; }
  .url-row input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
  }
  .url-row input:focus { outline: none; border-color: var(--accent); }
  .url-row button {
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 10px 16px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--card);
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
  }
  .url-row button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 14px; }
  select {
    font: inherit; font-size: 14px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
  }
  .file-info {
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--accent-soft);
    border-radius: 10px;
    font-size: 13px;
    display: none;
    word-break: break-all;
  }
  .file-info .name { font-weight: 600; }
  .file-info .meta { color: var(--muted); margin-top: 2px; }
  button.go {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    font: inherit; font-size: 15px; font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity .15s;
  }
  button.go:disabled { opacity: .45; cursor: not-allowed; }
  .progress-wrap { margin-top: 16px; display: none; }
  .progress-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .bar { height: 24px; background: #e4e4de; border-radius: 99px; overflow: hidden; position: relative; }
  .bar canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .result {
    margin-top: 16px;
    display: none;
    text-align: center;
  }
  .result a {
    display: inline-block;
    padding: 13px 28px;
    font-size: 15px; font-weight: 600;
    color: #fff;
    background: var(--accent);
    border-radius: 10px;
    text-decoration: none;
  }
  .result .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .error {
    margin-top: 16px;
    padding: 12px 14px;
    background: #f7ecec;
    border-radius: 10px;
    color: var(--danger);
    font-size: 13px;
    display: none;
  }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<div class="app">
  <h1>视频转 MP3</h1>
  <p class="sub">在浏览器本地完成，文件不会上传到任何服务器</p>
  <div class="card">
    <div class="drop" id="drop">
      <div class="icon">🎬</div>
      <div class="hint">点击选择或拖入 MP4 文件</div>
      <div class="tip">1 GB 以内</div>
    </div>
    <input type="file" id="file" accept="video/mp4,video/quicktime,audio/mp4,.mp4,.m4v,.mov,.m4a">
    <div class="or"><span>或</span></div>
    <div class="url-row">
      <input type="url" id="videoUrl" placeholder="粘贴视频链接（mp4 直链）">
      <button id="fetchUrl">获取</button>
    </div>
    <div class="file-info" id="fileInfo">
      <div class="name" id="fileName"></div>
      <div class="meta" id="fileMeta"></div>
    </div>
    <div class="row">
      <span>音质（码率）</span>
      <select id="bitrate">
        <option value="96">96 kbps · 较小</option>
        <option value="128" selected>128 kbps · 推荐</option>
        <option value="192">192 kbps · 较好</option>
        <option value="256">256 kbps · 最好</option>
      </select>
    </div>
    <button class="go" id="go" disabled>转换为 MP3</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label"><span id="stage">处理中</span><span id="pct">0%</span></div>
      <div class="bar"><canvas id="pixels"></canvas></div>
    </div>
    <div class="result" id="result">
      <a id="dl" download>⬇ 下载 MP3</a>
      <div class="meta" id="resultMeta"></div>
    </div>
    <div class="error" id="error"></div>
  </div>
  <p class="foot">支持 mp4 / mov / m4a 中的 AAC 音轨</p>
</div>

<script src="__LAME__"></script>
<script>
const MAX_LABEL = '1 GB';
const MAX_SIZE = 1024 * 1024 * 1024;
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), go = $('go');
let picked = null;
let lastUrl = null;

function fmtSize(n) {
  if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function fmtDur(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m ? `${m} 分 ${s} 秒` : `${s} 秒`;
}
function showError(msg) {
  $('error').textContent = msg;
  $('error').style.display = 'block';
}
function reset() {
  $('error').style.display = 'none';
  $('result').style.display = 'none';
  $('progressWrap').style.display = 'none';
  PixelBar.reset();
  if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
}

function pick(file) {
  reset();
  if (!file) return;
  if (file.size > MAX_SIZE) {
    picked = null;
    go.disabled = true;
    $('fileInfo').style.display = 'none';
    showError(`文件 ${fmtSize(file.size)}，超过 ${MAX_LABEL} 上限，请换个小一点的文件。`);
    return;
  }
  picked = file;
  $('fileName').textContent = file.name;
  $('fileMeta').textContent = fmtSize(file.size);
  $('fileInfo').style.display = 'block';
  go.disabled = false;
}

// —— 链接获取 ——
const urlInput = $('videoUrl'), urlBtn = $('fetchUrl');

async function readStream(res, name) {
  const lenHeader = res.headers.get('content-length');
  const totalLen = lenHeader ? parseInt(lenHeader, 10) : 0;
  if (totalLen > MAX_SIZE) throw new Error('TOO_LARGE');
  const reader = res.body.getReader();
  const chunks = [];
  let received = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (received > MAX_SIZE) { reader.cancel(); throw new Error('TOO_LARGE'); }
    // 拿不到总大小时用渐近比例，只让条子有前进感，不谎报完成
    const ratio = totalLen ? received / totalLen : received / (received + 20 * 1024 * 1024);
    setProgress(`下载视频 · ${fmtSize(received)}`, ratio * 0.98);
  }
  return new File(chunks, name, { type: res.headers.get('content-type') || 'video/mp4' });
}

async function fetchFromUrl() {
  const url = urlInput.value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) { reset(); showError('链接要以 http:// 或 https:// 开头。'); return; }
  reset();
  urlBtn.disabled = true;
  urlBtn.textContent = '下载中…';
  let name = 'video.mp4';
  try {
    const base = decodeURIComponent(new URL(url).pathname.split('/').pop() || '');
    if (base) name = /\.[a-z0-9]{2,5}$/i.test(base) ? base : base + '.mp4';
  } catch {}
  try {
    let res = null;
    try { res = await fetch(url); } catch {}
    if (!res || !res.ok) {
      // 源站不允许跨域直读时，走同源代理（部署环境是 CF Pages Function，本地是 serve.mjs）
      try { res = await fetch('/fetch?url=' + encodeURIComponent(url)); } catch {}
    }
    if (!res || !res.ok) throw new Error('FETCH_FAIL');
    const file = await readStream(res, name);
    pick(file);
  } catch (err) {
    console.error(err);
    reset();
    showError(err.message === 'TOO_LARGE'
      ? `链接指向的文件超过 ${MAX_LABEL} 上限。`
      : '没能下载这个链接。请确认它是视频文件的直链；若源站禁止外部读取，需在部署好的站点上使用（本地双击打开的页面没有代理）。');
  } finally {
    urlBtn.disabled = false;
    urlBtn.textContent = '获取';
  }
}
urlBtn.addEventListener('click', fetchFromUrl);
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchFromUrl(); });

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => pick(fileInput.files[0]));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  pick(e.dataTransfer.files[0]);
});

// 像素点阵进度条：紫色方块随进度从左到右随机浮现，越靠右越密；
// 完成后的终态是「左侧稀疏 → 右侧密集」的渐变马赛克。
const PixelBar = (() => {
  const CELL = 5;                    // 每格 5px：4px 方块 + 1px 间隙
  const PALETTE = ['#c7bcf6', '#a893f1', '#8d73ea', '#7357e2', '#5b3fd6'];
  const DOT = '#b0b0aa';
  let canvas, ctx, w = 0, h = 0, cols = 0, rows = 0, offY = 0;
  let shown = 0, target = 0, raf = null, seed = 7, resolvers = [];

  // 每个格子一组确定的伪随机数：同一次转换里重绘不闪烁
  function hash(i, j, k) {
    let t = (i * 374761393 + j * 668265263 + k * 2246822519 + seed * 971) | 0;
    t = Math.imul(t ^ (t >>> 13), 1274126177);
    t ^= t >>> 16;
    return (t >>> 0) / 4294967296;
  }
  function measure() {
    const rect = canvas.parentElement.getBoundingClientRect();
    if (!rect.width) return;
    const dpr = window.devicePixelRatio || 1;
    w = rect.width; h = rect.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(w / CELL);
    rows = Math.floor(h / CELL);
    offY = (h - rows * CELL) / 2;
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = DOT;             // 底部等距刻度点，未覆盖处可见
    for (let x = 18; x < w - 10; x += 38) {
      ctx.beginPath(); ctx.arc(x, h / 2, 2, 0, Math.PI * 2); ctx.fill();
    }
    const smooth01 = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
    for (let i = 0; i < cols; i++) {
      const cx = (i + 0.5) * CELL / w;                       // 归一化横向位置
      // 终态密度：左侧只留零星几点，约 3/4 处起接近铺满（对照参考图）
      let density = 0.03 + 0.97 * smooth01((cx - 0.16) / 0.55);
      // 推进前沿多冒一圈像素，像素「正在落下」的感觉；完成后自然并入终态
      if (shown < 1) {
        const dist = Math.abs(cx - shown * 1.02);
        density = Math.min(1, density + Math.max(0, 1 - dist / 0.10) * 0.3);
      }
      const appear = Math.max(0, Math.min(1, (shown * 1.15 - cx) / 0.14)); // 渐显前沿
      if (appear <= 0) continue;
      for (let j = 0; j < rows; j++) {
        if (hash(i, j, 1) > density) continue;
        if (hash(i, j, 2) > appear) continue;
        ctx.globalAlpha = 0.7 + 0.3 * hash(i, j, 3);
        ctx.fillStyle = PALETTE[Math.floor(hash(i, j, 4) * PALETTE.length)];
        ctx.fillRect(i * CELL, offY + j * CELL, CELL - 1, CELL - 1);
      }
    }
    ctx.globalAlpha = 1;
  }
  function tick() {
    // 逼近目标但限速：即使转换瞬间完成，整条铺满也有约 1.2 秒的浮现过程
    const step = Math.min(Math.max((target - shown) * 0.09, 0.0028), 0.014);
    shown = Math.min(target, shown + step);
    draw();
    $('pct').textContent = Math.round(shown * 100) + '%';
    if (shown < target - 1e-4) raf = requestAnimationFrame(tick);
    else {
      raf = null;
      if (shown >= 0.9999) { resolvers.forEach(r => r()); resolvers = []; }
    }
  }
  function setTarget(t) {
    if (!canvas) canvas = $('pixels');
    if (!w || Math.abs(canvas.parentElement.getBoundingClientRect().width - w) > 1) measure();
    target = Math.max(target, Math.min(1, t));
    if (!raf && ctx) raf = requestAnimationFrame(tick);
  }
  function reset() {
    shown = 0; target = 0; seed = (seed * 31 + 17) % 100000;  // 每次转换换一副随机分布
    if (raf) cancelAnimationFrame(raf);
    raf = null; resolvers = [];
    if (ctx) ctx.clearRect(0, 0, w, h);
  }
  function done() {
    return shown >= 0.9999 ? Promise.resolve() : new Promise(r => resolvers.push(r));
  }
  return { setTarget, reset, done };
})();

function setProgress(stage, ratio) {
  $('progressWrap').style.display = 'block';
  $('stage').textContent = stage;
  PixelBar.setTarget(ratio);
}

// 把 float 采样按块转成 int16，复用同一块缓冲，避免为整段音频再复制一份 PCM
function fillInt16(dst, src, off, n) {
  for (let k = 0; k < n; k++) {
    const s = Math.max(-1, Math.min(1, src[off + k]));
    dst[k] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
}

// 核心转换：任意含音轨的媒体 Blob → MP3 Blob（测试也会直接调它）
async function convertBlob(blob, kbps, onProgress) {
  const buf = await blob.arrayBuffer();
  onProgress && onProgress('解码音轨', 0);
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let audio;
  try {
    audio = await ctx.decodeAudioData(buf);
  } finally {
    ctx.close();
  }
  const channels = Math.min(2, audio.numberOfChannels);
  const leftF = audio.getChannelData(0);
  const rightF = channels === 2 ? audio.getChannelData(1) : null;
  const total = leftF.length;
  const encoder = new lamejs.Mp3Encoder(channels, audio.sampleRate, kbps);
  const chunkSize = 1152 * 40;
  const l16 = new Int16Array(chunkSize);
  const r16 = rightF ? new Int16Array(chunkSize) : null;
  const parts = [];
  for (let i = 0; i < total; i += chunkSize) {
    const n = Math.min(chunkSize, total - i);
    fillInt16(l16, leftF, i, n);
    const l = n === chunkSize ? l16 : l16.subarray(0, n);
    let mp3;
    if (rightF) {
      fillInt16(r16, rightF, i, n);
      mp3 = encoder.encodeBuffer(l, n === chunkSize ? r16 : r16.subarray(0, n));
    } else {
      mp3 = encoder.encodeBuffer(l);
    }
    if (mp3.length) parts.push(mp3);
    if (onProgress) {
      onProgress('编码 MP3', i / total);
      await new Promise(r => setTimeout(r, 0));
    }
  }
  const end = encoder.flush();
  if (end.length) parts.push(end);
  onProgress && onProgress('完成', 1);
  return { blob: new Blob(parts, { type: 'audio/mpeg' }), duration: audio.duration };
}
window.convertBlob = convertBlob; // 供自动化测试调用

go.addEventListener('click', async () => {
  if (!picked) return;
  reset();
  go.disabled = true;
  const kbps = parseInt($('bitrate').value, 10);
  try {
    const { blob, duration } = await convertBlob(picked, kbps, setProgress);
    await PixelBar.done();   // 等像素铺满再亮下载按钮
    lastUrl = URL.createObjectURL(blob);
    const a = $('dl');
    a.href = lastUrl;
    a.download = picked.name.replace(/\.[^.]+$/, '') + '.mp3';
    $('resultMeta').textContent = `${fmtDur(duration)} · ${fmtSize(blob.size)} · ${kbps} kbps`;
    $('result').style.display = 'block';
  } catch (err) {
    console.error(err);
    $('progressWrap').style.display = 'none';
    showError('转换失败：没能从这个文件里解出音轨。请确认它是带声音的 MP4（AAC 音轨）。');
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
